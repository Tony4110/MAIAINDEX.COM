name: MAIA daily capture

# Daily snapshot of the Longevity Credibility Index.
# 06:00 UTC = ~01:00-02:00 America/New_York -> inside NCBI's off-peak window.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only process the first N ingredients (smoke test). Leave blank for all.'
        required: false
        default: ''

concurrency:
  group: maia-capture
  cancel-in-progress: false

permissions:
  contents: write   # allows the failure reporter to post a commit comment

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run capture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -o pipefail
          node scripts/capture.js 2>&1 | tee capture.log

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          try:
              tail = open('capture.log','r',errors='replace').read()[-5000:]
          except Exception as e:
              tail = f'(no capture.log: {e})'
          body = "**MAIA capture failed** — last output:\n\n```\n" + tail + "\n```"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ['GH_TOKEN'],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              })
          try:
              r = urllib.request.urlopen(req)
              print("comment posted:", r.status)
          except Exception as e:
              print("failed to post comment:", e)
          PY
